<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataViz Dashboard — 低代码可视化数据看板</title>
<style>
:root {
    --bg: #0a0f1d; --surface: rgba(15,21,37,0.7); --border: rgba(255,255,255,0.06);
    --primary: #6c83f7; --accent: #f72585; --text: #e0e4f0; --text-muted: #64748b;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Consolas', 'Fira Code', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* Canvas particle background */
#particle-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.page { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
.hero { text-align: center; padding: 60px 0 40px; }
.hero h1 { font-size: 2.8rem; margin-bottom: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 24px; line-height: 1.7; }
.hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn { display: inline-block; padding: 10px 24px; border-radius: 999px; font-size: 0.95rem; font-weight: 600; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; font-family: inherit; }
.btn-primary { background: linear-gradient(135deg, var(--primary), #4a62e1); color: #fff; }
.btn-primary:hover { box-shadow: 0 0 24px rgba(108,131,247,0.4); transform: translateY(-1px); }
.btn-glass { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); color: var(--text); }
.btn-glass:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(108,131,247,0.12); }

.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 50px 0; }
.feature-card { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center; transition: all 0.3s; }
.feature-card:hover { transform: translateY(-4px); border-color: rgba(108,131,247,0.3); box-shadow: 0 0 30px rgba(108,131,247,0.08); }
.feature-icon { font-size: 2.2rem; margin-bottom: 12px; }
.feature-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
.feature-card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

.quick-start { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin: 40px 0; }
.quick-start h2 { margin-bottom: 16px; }
.quick-start code { display: block; background: rgba(0,0,0,0.3); padding: 16px 20px; border-radius: 10px; font-family: var(--mono); font-size: 0.85rem; line-height: 1.7; overflow-x: auto; }

.board-list { margin: 40px 0; }
.board-list h2 { margin-bottom: 16px; }
.board-item { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s; }
.board-item:hover { border-color: rgba(108,131,247,0.2); }
.board-item-info { flex: 1; }
.board-item-info h3 { font-size: 1rem; margin-bottom: 4px; }
.board-item-info span { font-size: 0.78rem; color: var(--text-muted); }
.board-item-actions { display: flex; gap: 8px; }
.btn-sm { padding: 6px 14px; font-size: 0.78rem; }
.btn-danger { background: transparent; border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; }
.btn-danger:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

@media (max-width: 768px) {
    .features { grid-template-columns: 1fr; }
    .hero h1 { font-size: 2rem; }
}
</style>
</head>
<body>
<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div class="page">
    <header class="hero">
        <h1>DataViz Dashboard</h1>
        <p>企业级低代码可视化数据看板平台 — Schema 驱动、通用数据桥接、动态 ECharts 渲染、版本回滚</p>
        <div class="hero-actions">
            <a href="/builder" class="btn btn-primary">搭建看板</a>
            <a href="/view/1" class="btn btn-glass">查看 Demo</a>
            <span id="auth-action"></span>
        </div>
    </header>

    <div class="features">
        <div class="feature-card">
            <div class="feature-icon">&#128202;</div>
            <h3>Schema 驱动</h3>
            <p>通过 JSON Schema 描述数据源、图表类型和布局，前后端解耦，动态渲染</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">&#128279;</div>
            <h3>通用数据桥</h3>
            <p>支持 MySQL / PostgreSQL / SQLite / HTTP API 异构数据源，SQL 标准化归一</p>
        </div>
        <div class="feature-card">
            <div class="feature-icon">&#9194;</div>
            <h3>版本回滚</h3>
            <p>每次保存自动生成版本快照，一键回滚到任意历史版本</p>
        </div>
    </div>

    <div class="board-list" id="board-list-section">
        <h2>所有看板</h2>
        <div id="board-list" style="color:var(--text-muted);text-align:center;padding:20px;">加载中...</div>
    </div>
</div>

<script>
(function () {
    var c = document.getElementById("particle-canvas");
    var ctx = c.getContext("2d");
    var particles = [];
    var W, H;

    function resize() {
        var dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        c.width = W * dpr; c.height = H * dpr;
        c.style.width = W + "px"; c.style.height = H + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize(); window.addEventListener("resize", resize);

    var count = Math.floor((W * H) / 14000);
    for (var i = 0; i < count; i++) {
        particles.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, r: Math.random() * 2 + 1 });
    }

    function draw() {
        ctx.fillStyle = "rgba(10,15,29,0.15)";
        ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(108,131,247,0.35)"; ctx.fill();
            for (var j = i + 1; j < particles.length; j++) {
                var q = particles[j], dx = p.x - q.x, dy = p.y - q.y, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 130) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.strokeStyle = "rgba(108,131,247," + (1 - dist / 130) * 0.12 + ")"; ctx.stroke(); }
            }
        }
        requestAnimationFrame(draw);
    }
    draw();

    // ── Auth ───────────────────────────────────────────
    function authFetch(url, opts) {
        opts = opts || {};
        var headers = opts.headers || {};
        var token = localStorage.getItem("dv_token");
        if (token) { headers["Authorization"] = "Bearer " + token; }
        opts.headers = headers;
        return fetch(url, opts);
    }

    var user = JSON.parse(localStorage.getItem("dv_user") || "null");
    var authSpan = document.getElementById("auth-action");
    if (user) {
        authSpan.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;margin-left:8px;">' + user.username + '</span>' +
            '<button class="btn btn-glass" onclick="localStorage.clear();window.location.href=\'/login\'" style="margin-left:8px;">退出</button>';
    } else {
        authSpan.innerHTML = '<a href="/login" class="btn btn-glass">登录</a>';
    }

    // ── Board list ───────────────────────────────────────────
    function loadBoardList() {
        fetch("/api/dashboard/list")
            .then(function (r) { return r.json(); })
            .then(function (boards) {
                var container = document.getElementById("board-list");
                if (!boards.length) {
                    container.innerHTML = '<div style="padding:20px;color:var(--text-muted)">还没有看板，点击上方按钮创建</div>';
                    return;
                }
                container.innerHTML = boards.map(function (b) {
                    return '<div class="board-item">' +
                        '<div class="board-item-info"><h3>' + b.name + '</h3><span>更新于 ' + (b.updated_at || b.created_at).slice(0, 10) + '</span></div>' +
                        '<div class="board-item-actions">' +
                        '<a href="/view/' + b.id + '" class="btn btn-sm">查看</a>' +
                        '<a href="/builder" class="btn btn-sm" onclick="localStorage.setItem(\'editBoardId\',\'' + b.id + '\')">编辑</a>' +
                        '<button class="btn btn-sm btn-danger" data-id="' + b.id + '">删除</button>' +
                        '</div></div>';
                }).join("");

                container.querySelectorAll(".btn-danger").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        var id = this.getAttribute("data-id");
                        if (!confirm("确定删除该看板吗？此操作不可撤销。")) return;
                        var token = localStorage.getItem("dv_token");
                        var headers = token ? {"Authorization": "Bearer " + token} : {};
                        fetch("/api/dashboard/" + id, { method: "DELETE", headers: headers })
                            .then(function () { loadBoardList(); });
                    });
                });
            });
    }
    loadBoardList();
})();
</script>
</body>
</html>
